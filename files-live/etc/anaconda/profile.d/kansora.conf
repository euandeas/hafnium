# Anaconda configuration for Kansora, on the live ISO only (kansora-live).
#
# Kansora's os-release keeps ID=fedora and sets VARIANT_ID=kansora, so this is
# picked over the plain Fedora profile. It inherits that profile (btrfs with
# zstd, EFI paths, closest mirror) rather than Workstation's: Workstation hides
# the account screen and leaves user creation to gnome-initial-setup, which
# Kansora doesn't have.

[Profile]
profile_id = kansora
base_profile = fedora

[Profile Detection]
os_id = fedora
variant_id = kansora

[Bootloader]
# Matches what the kansora package sets on first install
menu_auto_hide = True
