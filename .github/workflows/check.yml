name: Check

# Builds the packages, validates the kickstarts, dry-runs the full install
# transaction against the real repos, tests the default dotfiles end to end
# (mise + DMS + niri validate) and lints scripts. See build-scripts/check.
# Also called by repo.yml so nothing is published unless this passes.

on:
  push:
    branches-ignore: [main] # main is covered by repo.yml, which calls this
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install git
        run: dnf install -y git-core

      - name: Checkout kansora
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kansora
          # Use the commit being checked when this is the kansora repo, otherwise main.
          ref: ${{ github.event.repository.name == 'kansora' && github.sha || 'main' }}
          path: kansora
          fetch-depth: 0

      - name: Checkout kdots
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kdots
          ref: ${{ github.event.repository.name == 'kdots' && github.sha || 'main' }}
          path: kdots
          fetch-depth: 0

      - name: Install tools
        run: kansora/build-scripts/ci-setup

      - name: Check
        env:
          STRICT: "1"
        run: kansora/build-scripts/check kdots out/check

      - name: Upload the built package repo
        # repo.yml publishes this exact build instead of building again
        uses: actions/upload-artifact@v7
        with:
          name: kansora-repo
          path: out/check/build/repo
          if-no-files-found: error
          retention-days: 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: out/check/*.log
          retention-days: 7
