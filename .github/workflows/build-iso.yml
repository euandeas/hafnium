name: Build ISOs

on:
  push:
    branches: [main]
    paths:
      - "kickstart/**"
      - "build-scripts/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "kickstart/**"
      - "build-scripts/**"
  schedule:
    # Weekly, so the ISO picks up the latest Fedora installer
    - cron: "0 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
      # mkksiso may loop-mount efiboot.img
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant: [kansora, kansora-nvidia]
    env:
      FEDORA_VERSION: "45"
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git-core lorax xorriso pykickstart gh

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ISO
        run: build-scripts/build-iso "${{ matrix.variant }}" out

      - name: Upload artifact (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}
          path: |
            out/*.iso
            out/*.sha256
            out/*.ks
          retention-days: 3
          compression-level: 0

      - name: Publish to the rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export GH_REPO="$GITHUB_REPOSITORY"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Kansora (latest)" --latest \
              --notes "Rolling build of the Kansora installer ISOs from main. Each ISO is a Fedora netinstall with the Kansora kickstart embedded, so it needs internet access while installing."
          gh release upload latest out/*.iso out/*.sha256 out/*.ks --clobber
          # Point the tag at the commit these ISOs were built from
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          gh release edit latest --notes "Rolling build of the Kansora installer ISOs, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Each ISO is a Fedora netinstall with the Kansora kickstart embedded, so it needs internet access while installing."
