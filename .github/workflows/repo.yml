name: Build package repo

# Builds the kansora and kansora-dots RPMs and publishes them as a dnf repo on
# GitHub Pages: https://euandeas.github.io/kansora/repo/
# Installers and installed systems pull Kansora updates from there.
#
# kdots is a separate repo. Its own workflow triggers this one after a push to its
# main branch if it has a KANSORA_DISPATCH_TOKEN secret; otherwise run this by
# hand (`gh workflow run repo.yml -R euandeas/kansora`) or wait for the nightly run.
# check.yml builds and tests the packages; this publishes that same build, so
# nothing is published unless the checks pass.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Get the packages the check job built
        uses: actions/download-artifact@v7
        with:
          name: kansora-repo
          path: _site/repo

      - name: Add an index page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>Kansora repo</title>'
            echo '<h1>Kansora dnf repo</h1><p>Used by the Kansora installer and <code>kansora-repos</code>.</p><ul>'
            for f in _site/repo/*.rpm; do n="$(basename "$f")"; echo "<li><a href=\"repo/$n\">$n</a></li>"; done
            echo '</ul>'
          } > _site/index.html
          test -f _site/repo/repodata/repomd.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
