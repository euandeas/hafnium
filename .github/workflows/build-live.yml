name: Build live ISO

# The Kansora live ISO (kiwi, live/kansora.kiwi). It installs the kansora and
# kansora-live packages from the published package repo, so run "Build package
# repo" first when changing those.

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "build-scripts/build-live"
      - ".github/workflows/build-live.yml"
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: |
          sudo podman run --rm --privileged \
            -v "$PWD:/src:Z" -w /src \
            registry.fedoraproject.org/fedora:45 \
            bash -c 'dnf install -y --setopt=install_weak_deps=False kiwi kiwi-systemdeps distribution-gpg-keys \
                     && build-scripts/build-live out'
          ls -la out

      - name: Publish to the rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload latest out/kansora-live-*.iso out/kansora-live-*.iso.sha256 --clobber
