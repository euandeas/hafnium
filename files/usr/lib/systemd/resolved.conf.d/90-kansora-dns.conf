# Kansora DNS: Cloudflare over TLS, Quad9 as fallback.
# "~." sends every lookup to these servers in preference to the DNS your network
# hands out over DHCP. VPN split-DNS domains still go to the VPN.
# Override in /etc/systemd/resolved.conf.d/ (e.g. set DNS= and Domains= to empty to undo).
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 9.9.9.9#dns.quad9.net 2620:fe::fe#dns.quad9.net
Domains=~.
DNSOverTLS=opportunistic
DNSStubListenerExtra=::1
