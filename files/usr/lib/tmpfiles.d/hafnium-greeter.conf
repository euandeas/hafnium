# Give the login screen Hafnium's Flexoki look until a user runs `hjust sync-greeter`
# (dms-greeter sync), which replaces these links with that user's theme.
# L only creates a link if nothing is there, so synced files are never touched.
L /var/cache/dms-greeter/settings.json - greeter greeter - /usr/share/hafnium/dots/dms/settings.json
L /var/cache/dms-greeter/session.json  - greeter greeter - /usr/share/hafnium/dots/dms/session.json
