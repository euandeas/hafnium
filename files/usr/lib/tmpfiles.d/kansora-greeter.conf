# Give the login screen Kansora's Flexoki look until a user runs `kansora sync-greeter`
# (dms-greeter sync), which replaces these links with that user's theme.
# L only creates a link if nothing is there, so synced files are never touched.
# Verified on a fresh install: the first login screen shows Flexoki and the orb
# wallpaper from these links. CI checks both targets exist in kdots.
L /var/cache/dms-greeter/settings.json - greeter greeter - /usr/share/kansora/dots/dms/settings.json
L /var/cache/dms-greeter/session.json  - greeter greeter - /usr/share/kansora/dots/dms/session.json
