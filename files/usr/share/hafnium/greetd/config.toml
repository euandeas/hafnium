# Hafnium greetd config: the DMS login screen running under niri.
# Installed to /etc/greetd/config.toml by the hafnium package when greetd isn't
# already set up for dms-greeter. It's yours after that: `dms-greeter sync` can
# change it (e.g. auto-login), and Hafnium won't overwrite it.

[terminal]
vt = 1

[default_session]
user = "greeter"
command = "/usr/bin/dms-greeter --command niri --cache-dir /var/cache/dms-greeter"
