<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Hafnium: Commit Mono (Nerd Font) is the default monospace font.
     Runs before 59-adwaita-mono-fonts.conf and 60-latin.conf so it wins.
     Per-user override: ~/.config/fontconfig/fonts.conf -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>CommitMono Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
